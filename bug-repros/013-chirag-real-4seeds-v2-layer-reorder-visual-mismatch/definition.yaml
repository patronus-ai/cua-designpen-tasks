id: 013-chirag-real-4seeds-v2-layer-reorder-visual-mismatch
start_url: http://cua_designpen.web
prompt: |
  You are verifying a reported z-order bug: reordering layers changes their order in
  the layers panel tree but NOT the visual stacking on the canvas — the moved layer
  still paints in its old position in the stack.

  The canvas loads the production seed document. Pan/zoom to an empty area of the canvas and work there. Steps:

  1. Draw three overlapping rectangles at roughly the same spot, each about 150x150,
     offset ~40px from one another so all three partially overlap. Give them three
     clearly different fill colors (e.g. red, green, blue) — note which was drawn
     last (it should paint on top).
  2. Screenshot and record the visible stacking order.
  3. In the layers panel, drag the BOTTOM rectangle's layer to the top of the list
     (or use the context menu / keyboard shortcut to bring it to front).
  4. Screenshot the canvas: that rectangle must now visually paint ON TOP of the other
     two, matching its new position in the layers panel.
  5. Now send the current top layer to the back the same way, and verify the canvas
     restacks accordingly.

  The bug reproduces if the layers panel shows the new order but the canvas keeps
  painting the old stacking (tree order and visual order disagree).

  Work cheaply: screenshot only at the checkpoints above, never retry a failed
  interaction more than twice, and aim to finish within roughly 25 tool calls.

  At the very end of your final message, state whether the task went smoothly. If
  everything worked without problems, end with exactly "verdict: approve". If you hit
  any problems, bugs, or blockers (including the bug above reproducing), briefly say
  what went wrong and end with exactly "verdict: not-approve".
bootstrap_data:
  seed: broking-v4
available_tools:
- browser_navigate
- browser_screenshot
- browser_click
- browser_right_click
- browser_double_click
- browser_mouse_move
- browser_drag
- browser_scroll
- browser_scroll_to
- browser_press_key
- browser_type
- browser_wait
- browser_get_page_text
- browser_evaluate
required_tools:
- browser
rewards:
- name: Task went smooth (agent verdict)
  kind: answer
  comparator: STRING_CONTAINS
  expected: 'verdict: approve'
