id: 022-designpen-v6-ptdev-fable-5-10x-icon-vector-broken-after-swap
start_url: http://cua_designpen.web
prompt: |
  You are verifying a reported renderer bug: swapping an icon instance for another
  icon (or scaling an icon) leaves the vector rendering broken — partial paths,
  slivers, open arcs, faint dashes or black squares — until the icon is deleted and
  a fresh copy is placed.

  The canvas already contains a design document with an icon library. Steps:

  1. From the Assets panel, place a fresh icon component on empty canvas at 24px or
     larger. Zoom in and screenshot: it must render its complete geometry.
  2. With it selected, swap it to a DIFFERENT icon using the swap-instance
     affordance (right panel or right-click menu). Zoom in and screenshot: the new
     icon must render complete — not a partial arc, sliver, faint dashes or a black
     square.
  3. Swap once more to a third icon and re-verify.
  4. Place a library component that contains a nested icon (a row- or button-like
     component with an icon slot), double-click into the nested icon and swap it.
     Zoom: the swapped nested icon must render correctly.
  5. Scale one standalone icon from 24 to 48 via the W/H fields; its geometry must
     scale intact.

  The bug reproduces if any swapped or scaled icon renders partial, garbled or
  black-square vectors.

  Separate known issue: nested-instance swaps can also silently REVERT later — that
  is covered elsewhere; the target here is a broken RENDER of the swapped vector.

  Note: this document has known content defects — some component text properties are not wired to their nested text layers, and a few text styles are bound to fonts not shipped in this environment (text renders invisible with them). These are seed-content issues, not the bug under test; do not report them.

  Important: do NOT reload the page — this environment intentionally discards the document on reload; a reset after reload is not a defect.

  Work cheaply: screenshot only at the checkpoints above, never retry a failed
  interaction more than twice, and aim to finish within roughly 30 tool calls.

  At the very end of your final message, state whether the task went smoothly. If
  everything worked without problems, end with exactly "verdict: approve". If you hit
  any problems, bugs, or blockers (including the bug above reproducing), briefly say
  what went wrong and end with exactly "verdict: not-approve".
bootstrap_data:
  seed: ptdev-v4
available_tools:
- browser_navigate
- browser_screenshot
- browser_click
- browser_right_click
- browser_double_click
- browser_mouse_move
- browser_drag
- browser_scroll
- browser_scroll_to
- browser_press_key
- browser_type
- browser_wait
- browser_get_page_text
- browser_evaluate
required_tools:
- browser
rewards:
- name: Task went smooth (agent verdict)
  kind: answer
  comparator: STRING_CONTAINS
  expected: 'verdict: approve'
