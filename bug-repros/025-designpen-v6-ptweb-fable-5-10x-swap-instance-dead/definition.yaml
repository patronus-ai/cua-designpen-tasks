id: 025-designpen-v6-ptweb-fable-5-10x-swap-instance-dead
start_url: http://cua_designpen.web
prompt: |
  You are verifying a reported bug in the Swap-instance feature: the swap dialog
  opens and its search returns results, but clicking a result row does nothing — the
  instance never swaps; this hits nested instances hardest. A related report: when a
  swap DOES apply, it can carry the old instance's overrides and render broken
  (e.g. white-on-white).

  The canvas already contains a design document with a component library. Steps:

  1. From the Assets panel, place a library component instance on empty canvas.
     Screenshot.
  2. Open its swap-instance affordance from the right panel, find a different
     component in the swap list, and click its row. Screenshot: the canvas must now
     show the new component in place of the old one.
  3. Now test a NESTED instance: place a component that contains a nested instance
     (a row- or card-like component with an icon or chip inside), double-click to
     select the nested instance, and swap it the same way. Verify the swap applies
     AND the result renders correctly (not blank, white-on-white or corrupt).

  The bug reproduces if clicking a swap result row is a no-op, or if the swapped
  result renders corrupt until replaced with a fresh instance.

  Note: this document has known content defects — several flat-named legacy text styles (the Body_16px family) are bound to missing fonts and render text invisible, and some component text properties are not wired. These are seed-content issues, not the bug under test; do not report them.

  Important: do NOT reload the page — this environment intentionally discards the document on reload; a reset after reload is not a defect.

  Work cheaply: screenshot only at the checkpoints above, never retry a failed
  interaction more than twice, and aim to finish within roughly 30 tool calls.

  At the very end of your final message, state whether the task went smoothly. If
  everything worked without problems, end with exactly "verdict: approve". If you hit
  any problems, bugs, or blockers (including the bug above reproducing), briefly say
  what went wrong and end with exactly "verdict: not-approve".
bootstrap_data:
  seed: ptweb-v4
available_tools:
- browser_navigate
- browser_screenshot
- browser_click
- browser_right_click
- browser_double_click
- browser_mouse_move
- browser_drag
- browser_scroll
- browser_scroll_to
- browser_press_key
- browser_type
- browser_wait
- browser_get_page_text
- browser_evaluate
required_tools:
- browser
rewards:
- name: Task went smooth (agent verdict)
  kind: answer
  comparator: STRING_CONTAINS
  expected: 'verdict: approve'
