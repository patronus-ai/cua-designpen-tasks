id: 031-designpen-v6-ptweb-fable-5-10x-apostrophe-breaks-text-measurement
start_url: http://cua_designpen.web
prompt: |
  You are verifying a reported bug: typing an apostrophe (') — and sometimes a
  comma — into text content or property values wedges text auto-measurement. The
  content is stored correctly, but the node keeps a tiny stale width and renders
  clipped. This has a deterministic character trigger, unlike general stale
  measurement.

  The canvas already contains a design document. Steps:

  1. With the Text tool, create a text node reading "Dont know yet" (no apostrophe)
     and commit. Screenshot: fully visible; note the node's width.
  2. Double-click into it, place the caret after "Don" and type an apostrophe so
     the content reads "Don't know yet". Commit with Escape. Zoom and screenshot:
     the full string must render un-clipped and the node width must have
     re-measured to fit.
  3. Create another text node "1200 points", then edit it to "1,200 points". Verify
     no clipping or wrap glitch appears after the comma edit.
  4. If a node is clipped, toggle its resizing Fixed-to-Hug and back and note
     whether that fixes it — confirming a stale measurement rather than lost
     content.

  The bug reproduces if the apostrophe or comma edit leaves the text clipped at a
  stale width.

  Note: this document has known content defects — several flat-named legacy text styles (the Body_16px family) are bound to missing fonts and render text invisible, and some component text properties are not wired. These are seed-content issues, not the bug under test; do not report them.

  Work cheaply: screenshot only at the checkpoints above, never retry a failed
  interaction more than twice, and aim to finish within roughly 30 tool calls.

  At the very end of your final message, state whether the task went smoothly. If
  everything worked without problems, end with exactly "verdict: approve". If you hit
  any problems, bugs, or blockers (including the bug above reproducing), briefly say
  what went wrong and end with exactly "verdict: not-approve".
bootstrap_data:
  seed: ptweb-v4
available_tools:
- browser_navigate
- browser_screenshot
- browser_click
- browser_right_click
- browser_double_click
- browser_mouse_move
- browser_drag
- browser_scroll
- browser_scroll_to
- browser_press_key
- browser_type
- browser_wait
- browser_get_page_text
- browser_evaluate
required_tools:
- browser
rewards:
- name: Task went smooth (agent verdict)
  kind: answer
  comparator: STRING_CONTAINS
  expected: 'verdict: approve'
