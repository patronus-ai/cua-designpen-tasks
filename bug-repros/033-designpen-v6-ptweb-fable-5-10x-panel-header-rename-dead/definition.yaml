id: 033-designpen-v6-ptweb-fable-5-10x-panel-header-rename-dead
start_url: http://cua_designpen.web
prompt: |
  You are verifying a reported bug: renaming a layer via the design-panel header
  (double-clicking the layer name at the top of the right panel) never commits,
  while renaming the same layer via its layers-panel row works fine.

  The canvas already contains a design document. Steps:

  1. Draw a rectangle on empty canvas (it gets a default name) and keep it
     selected.
  2. Double-click the layer name in the right panel's header, type
     "Renamed Via Header" and press Enter. Check the layers panel: the row must now
     show the new name. Screenshot.
  3. If it did not commit, rename the same node via the layers panel (double-click
     its row, type "Renamed Via Tree", Enter) and record that this path works.
  4. Try the header rename once more on a different node type (e.g. a frame) to
     confirm the behavior.

  The bug reproduces if the panel-header rename never commits while the layers-tree
  rename works.

  Note: this document has known content defects — several flat-named legacy text styles (the Body_16px family) are bound to missing fonts and render text invisible, and some component text properties are not wired. These are seed-content issues, not the bug under test; do not report them.

  Work cheaply: screenshot only at the checkpoints above, never retry a failed
  interaction more than twice, and aim to finish within roughly 30 tool calls.

  At the very end of your final message, state whether the task went smoothly. If
  everything worked without problems, end with exactly "verdict: approve". If you hit
  any problems, bugs, or blockers (including the bug above reproducing), briefly say
  what went wrong and end with exactly "verdict: not-approve".
bootstrap_data:
  seed: ptweb-v4
available_tools:
- browser_navigate
- browser_screenshot
- browser_click
- browser_right_click
- browser_double_click
- browser_mouse_move
- browser_drag
- browser_scroll
- browser_scroll_to
- browser_press_key
- browser_type
- browser_wait
- browser_get_page_text
- browser_evaluate
required_tools:
- browser
rewards:
- name: Task went smooth (agent verdict)
  kind: answer
  comparator: STRING_CONTAINS
  expected: 'verdict: approve'
