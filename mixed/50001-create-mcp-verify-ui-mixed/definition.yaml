id: 50001-create-mcp-verify-ui-mixed
start_url: http://cua_designpen.web
prompt: 'Build a shape over MCP, then confirm the UI is looking at the same document.


  1. With MCP, create a RECTANGLE named "Parity Card", 160x100, at x=60 y=60.

  2. In the browser, press Shift+1 to fit the canvas and take a screenshot — the rectangle must be on the canvas
  and "Parity Card" must appear in the layer list on the left.

  3. Click the layer in the UI and read the width, height, X and Y from the right-hand properties panel. They must
  match what you passed to create_shape.

  4. Rename the layer in the UI (double-click its name in the layer list) to "Parity Card UI".

  5. With MCP, find_nodes for "Parity Card UI" — exactly one hit, and get_node on it must report the new name and
  the unchanged geometry.

  6. Delete the node over MCP, then screenshot the canvas: the shape and its layer entry must both be gone.


  Work in the order given and keep it tight — one action per step, no exploratory detours. Every time you cross
  from MCP to UI or back, check that both surfaces agree about the same document.


  Report every disagreement you find using exactly this format, one block per finding:


  DESYNC #<n>

  Step: <what you did, on which surface>

  MCP says: <tool call and its result>

  UI says: <what the panel / canvas / layer list shows>

  Severity: <critical | major | minor | cosmetic>


  A value that reads back differently on the two surfaces, an edit on one surface that the other never sees, a node
  missing from one of them, or a stale read after a write all count as findings. Rounding of the same number (e.g.
  99.6 shown as 100) is cosmetic, not a desync. If both surfaces agreed throughout, state exactly "NO DESYNC FOUND".
  At the very end of your final message, end with exactly "mixed-report: complete".'
available_tools:
- browser_navigate
- browser_screenshot
- browser_click
- browser_right_click
- browser_double_click
- browser_mouse_move
- browser_drag
- browser_scroll
- browser_scroll_to
- browser_press_key
- browser_type
- browser_wait
- browser_get_page_text
- browser_evaluate
- browser_upload_file
- browser_create_tab
- browser_close_tab
- browser_switch_tab
- browser_list_tabs
- create_shape
- find_nodes
- get_node
- rename_node
- delete_node
required_tools:
- browser
- create_shape
- find_nodes
- get_node
- rename_node
- delete_node
rewards:
- name: Mixed MCP+UI report delivered
  kind: answer
  comparator: STRING_CONTAINS
  expected: 'mixed-report: complete'
