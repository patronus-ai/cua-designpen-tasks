id: 50006-component-instance-mixed
start_url: http://cua_designpen.web
prompt: 'Components created over MCP, overridden in the UI.


  1. With MCP, create a FRAME 200x80 named "Chip", put a TEXT node inside it with the content "Label", then turn
  the frame into a component.

  2. With MCP, create an instance of that component at x=320 y=60.

  3. In the browser, screenshot the canvas and the layer list: the component and the instance must both be listed,
  and the instance must be marked as an instance (its own icon), not as a plain frame.

  4. In the UI, double-click into the instance''s text and change it to "Buy now", then press Escape.

  5. With MCP, read the instance''s children — the text override must be "Buy now" while the main component''s text
  is still "Label". Either one leaking into the other is a finding.

  6. With MCP, change the main component''s text to "Label v2" and confirm in the UI that the instance keeps its
  override but any non-overridden property follows the main component.


  Work in the order given and keep it tight — one action per step, no exploratory detours. Every time you cross
  from MCP to UI or back, check that both surfaces agree about the same document.


  Report every disagreement you find using exactly this format, one block per finding:


  DESYNC #<n>

  Step: <what you did, on which surface>

  MCP says: <tool call and its result>

  UI says: <what the panel / canvas / layer list shows>

  Severity: <critical | major | minor | cosmetic>


  A value that reads back differently on the two surfaces, an edit on one surface that the other never sees, a node
  missing from one of them, or a stale read after a write all count as findings. Rounding of the same number (e.g.
  99.6 shown as 100) is cosmetic, not a desync. If both surfaces agreed throughout, state exactly "NO DESYNC FOUND".
  At the very end of your final message, end with exactly "mixed-report: complete".'
