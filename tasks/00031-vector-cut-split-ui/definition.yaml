id: 00031-vector-cut-split-ui
start_url: http://cua_designpen.web
prompt: |-
  Draw a straight line with the Pen tool (P) and commit it. Double-click it to enter vector edit mode, activate the Cut subtool (X), and click at (or near) the line's midpoint to snip it there. A cut leaves two pieces that share a coincident point at the cut, so the exported path data may serialize as a single connected chain (one "M") even though the cut worked — do NOT judge by counting SVG subpaths or "M" commands, and clicking near the target point is enough (no exact-pixel precision required). Base your verdict on the end state: the shape has been cut/divided as described.

  At the very end of your final message, state whether the task went smoothly. If everything worked without problems, end with exactly "verdict: approve". If you hit any problems, bugs, or blockers, briefly say what went wrong and end with exactly "verdict: not-approve".
available_tools:
- browser_navigate
- browser_screenshot
- browser_click
- browser_right_click
- browser_double_click
- browser_mouse_move
- browser_drag
- browser_scroll
- browser_scroll_to
- browser_press_key
- browser_type
- browser_wait
- browser_get_page_text
- browser_evaluate
- browser_upload_file
- browser_create_tab
- browser_close_tab
- browser_switch_tab
- browser_list_tabs
required_tools:
- browser
rewards:
- name: Task went smooth (agent verdict)
  kind: answer
  comparator: STRING_CONTAINS
  expected: 'verdict: approve'
