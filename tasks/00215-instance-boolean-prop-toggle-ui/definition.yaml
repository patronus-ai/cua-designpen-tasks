id: 00215-instance-boolean-prop-toggle-ui
start_url: http://cua_designpen.web
prompt: 'Build a card component: a rectangle plus a small circle "notification dot", turned into a component.
  Expose the dot''s visibility as a BOOLEAN component property, then place an instance of the card on
  the canvas, select the instance, and switch the dot off via the property checkbox in the Design panel
  Properties section.


  Use the layer-level route to create the property: select the dot layer itself (inside the component)
  and use its "Create boolean property" button — that one binds the layer''s visibility and shows an eye
  icon on the property. Do not use the component-root Properties "+" form: its "Apply to layer" dropdown
  is a native select that the pointer driver often fails to commit, and a property created with no layer
  selected is a known no-op that currently cannot be deleted (tracked as RLCU-3000). If you end up with
  such a stray property, ignore it and judge the task by the layer-bound property working; a leftover
  unbound definition is not a blocker.


  At the very end of your final message, state whether the task went smoothly. If everything worked without
  problems, end with exactly "verdict: approve". If you hit any problems, bugs, or blockers, briefly say
  what went wrong and end with exactly "verdict: not-approve".'
