id: 00216-instance-switch-variant-ui
start_url: http://cua_designpen.web
prompt: 'Build a button component set with two size variants and switch an instance between them.


  Efficient route, follow it rather than exploring: draw a 120x40 rectangle, make it a component (Ctrl+Alt+K)
  and name it "Small"; draw a 220x40 rectangle, make it a component and name it "Large"; select both components
  and use "Create component set" (main menu or the canvas right-click menu) to combine them into one set.


  Then, before inserting anything, click an empty spot on the canvas (or press Escape) so you are no longer
  scoped inside the set — inserting while drilled into a component set parents the instance to the set
  instead of the page, which is a known app issue (RLCU-3025) and not something to spend turns fighting.
  With nothing entered, insert an instance of the Small variant from the Assets panel, select it, and
  switch it to the Large variant with the Variant section select in the Design panel; that select is a
  native dropdown, so if a click on the option does not commit, use the keyboard instead. Confirm the
  instance resizes from 120 to 220 wide.


  If the instance still lands inside the set, do not fight the canvas drag: cut it (Ctrl+X), click empty
  canvas, paste (Ctrl+V) — it lands at the page root — and carry on. A stray instance that had to be re-parented
  that way is not a reason to withhold approval; judge the task by the two-variant set existing and the
  instance switching from Small to Large.


  At the very end of your final message, state whether the task went smoothly. If everything worked without
  problems, end with exactly "verdict: approve". If you hit any problems, bugs, or blockers, briefly say
  what went wrong and end with exactly "verdict: not-approve".'
available_tools:
- browser_navigate
- browser_screenshot
