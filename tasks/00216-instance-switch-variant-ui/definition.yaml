id: 00216-instance-switch-variant-ui
start_url: http://cua_designpen.web
prompt: 'Build a button component set with two size variants and switch an instance between them.


  Efficient route, follow it rather than exploring: draw a 120x40 rectangle, make it a component (Ctrl+Alt+K)
  and name it "Small"; draw a 220x40 rectangle, make it a component and name it "Large"; select both components
  and use "Create component set" (main menu or the canvas right-click menu) to combine them into one set.


  Before inserting anything, click an empty spot on the canvas (or press Escape) so no container is entered
  — the instance belongs at the page root, next to the set, not inside it. Then insert an instance of
  the Small variant from the Assets panel, select it, and switch it to the Large variant with the Variant
  section select in the Design panel; that select is a native dropdown, so if a click on the option does
  not commit, use the keyboard instead. Confirm the instance resizes from 120 to 220 wide.


  Judge the task by the two-variant set existing and the instance switching from Small to Large.


  At the very end of your final message, state whether the task went smoothly. If everything worked without
  problems, end with exactly "verdict: approve". If you hit any problems, bugs, or blockers, briefly say
  what went wrong and end with exactly "verdict: not-approve".'
available_tools:
- browser_navigate
- browser_screenshot
- browser_click
- browser_right_click
- browser_double_click
- browser_mouse_move
- browser_drag
- browser_scroll
- browser_scroll_to
