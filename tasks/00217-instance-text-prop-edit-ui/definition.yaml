id: 00217-instance-text-prop-edit-ui
start_url: http://cua_designpen.web
prompt: |-
  Build a small button component containing a text label, and expose the label as a TEXT component property with default value "Click me". Place an instance, select it, and change the text property in the Design panel Properties section to "Buy now".

  At the very end of your final message, state whether you completed the deliverable. Base your verdict ONLY on whether the instance's text property now reads "Buy now" (the requested end state) — not on UX friction, naming quirks, extra clicks, or personal preferences, none of which are blockers. If you reached that end state, end with exactly "verdict: approve". Only if a crash or a genuinely broken/missing feature stopped you from reaching it, briefly say what blocked you and end with exactly "verdict: not-approve".
available_tools:
- browser_navigate
- browser_screenshot
- browser_click
- browser_right_click
- browser_double_click
- browser_mouse_move
- browser_drag
- browser_scroll
- browser_scroll_to
- browser_press_key
- browser_type
- browser_wait
- browser_get_page_text
- browser_evaluate
- browser_upload_file
- browser_create_tab
- browser_close_tab
- browser_switch_tab
- browser_list_tabs
required_tools:
- browser
rewards:
- name: Task went smooth (agent verdict)
  kind: answer
  comparator: STRING_CONTAINS
  expected: 'verdict: approve'
