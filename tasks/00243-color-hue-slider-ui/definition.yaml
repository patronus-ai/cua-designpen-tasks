id: 00243-color-hue-slider-ui
start_url: http://cua_designpen.web
prompt: |-
  Draw a rectangle and open its fill color picker. Drag the saturation/brightness handle to the fully saturated top-right corner, then drag the hue slider until the fill is pure blue (0000FF).

  Note on precision: the saturation/brightness area is a drag surface, and a drag can land a fraction short of the exact corner — the HSB readout rounds to 100/100 even when saturation is really 99.x, which shows up as a fill of 0101FF instead of 0000FF. This is drag rounding, not a broken color engine. If after dragging the fill is not exactly 0000FF, finish it with the reliable numeric path: set Hue = 240, Saturation = 100 and Brightness = 100 in the HSB input fields, or simply type 0000FF into the Hex field. Entering those exact values produces pure blue 0000FF. Judge success by the fill reaching 0000FF (via handle drags and/or the numeric fields); a residual 0101FF from imprecise dragging is not a bug — correct it with the numeric fields and approve.

  At the very end of your final message, state whether the task went smoothly. If everything worked without problems, end with exactly "verdict: approve". If you hit any problems, bugs, or blockers, briefly say what went wrong and end with exactly "verdict: not-approve".
