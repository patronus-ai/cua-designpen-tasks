id: 00312-text-paragraph-spacing-ui
start_url: http://cua_designpen.web
prompt: |-
  Create one text layer containing exactly two paragraphs: type "First paragraph", press Enter once, type "Second paragraph". Do NOT press Enter before the first word or after the last word — a stray leading or trailing line break creates an invisible empty paragraph that also receives spacing and skews the layout. Open the Type settings popover via the sliders button in the Typography section and set Paragraph spacing to 24 in the Basics tab.

  Base your verdict ONLY on whether a visible gap now separates the two paragraphs and the value 24 persists when you reopen the popover. (Correct behavior: spacing is applied only BETWEEN paragraphs, so the layer height grows by exactly one 24px gap.)

  At the very end of your final message, state whether the task went smoothly. If everything worked without problems, end with exactly "verdict: approve". If you hit any problems, bugs, or blockers, briefly say what went wrong and end with exactly "verdict: not-approve".
