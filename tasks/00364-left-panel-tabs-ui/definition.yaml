id: 00364-left-panel-tabs-ui
start_url: http://cua_designpen.web
prompt: |-
  Switch the left panel to the Assets view using the vertical icon rail along the far-left edge of the window (the File / Assets / Tools / Variables icons). Open Assets, then drag two instances of any component from "Created in this file" onto the canvas. If no component exists yet, first create a simple one: draw a rectangle, right-click it and choose "Create component", then drag it in twice from the Assets panel.

  Base your verdict ONLY on whether the Assets view opened from the rail and two instances landed on the canvas.

  At the very end of your final message, state whether the task went smoothly. If everything worked without problems, end with exactly "verdict: approve". If you hit any problems, bugs, or blockers, briefly say what went wrong and end with exactly "verdict: not-approve".
available_tools:
- browser_navigate
- browser_screenshot
- browser_click
- browser_right_click
- browser_double_click
- browser_mouse_move
- browser_drag
- browser_scroll
- browser_scroll_to
- browser_press_key
- browser_type
- browser_wait
- browser_get_page_text
- browser_evaluate
- browser_upload_file
- browser_create_tab
- browser_close_tab
- browser_switch_tab
- browser_list_tabs
required_tools:
- browser
rewards:
- name: Task went smooth (agent verdict)
  kind: answer
  comparator: STRING_CONTAINS
  expected: 'verdict: approve'
