id: 00391-file-save-as-ui
start_url: http://cua_designpen.web
prompt: |-
  Draw a circle, then save a copy of the document under a new file name "copy-of-design.fig" via Main menu > File > Save As… (Ctrl+Shift+S on this Linux environment). Because the browser's native file picker is unavailable over http, the app opens its own in-app Save As dialog (a modal with a filename input, data-test-id "save-as-dialog" / "save-as-filename"). Type "copy-of-design.fig" into the filename field and confirm with the "save-as-confirm" button.

  At the very end of your final message, state whether the task went smoothly. If everything worked without problems, end with exactly "verdict: approve". If you hit any problems, bugs, or blockers, briefly say what went wrong and end with exactly "verdict: not-approve".
