id: 00460-share-copy-invite-link-ui
start_url: http://cua_designpen.web
prompt: |
  Click the blue "Share" button at the top-right of the app (next to the Present control). This opens the "Share this file" dialog.

  In the dialog, confirm the collaboration UI: there is a "Who has access" section listing at least one access row (yourself, labeled as the owner). Then click the "Copy link" control in the dialog header to generate and copy the file's invite link to the clipboard.

  Confirm the invite-link flow worked: after clicking Copy link, the control's label changes to "Copied" (and/or a "Link copied" toast appears), meaning a shareable URL was placed on the clipboard. If you can, report the copied URL. Note that the email-invite input in the dialog is intentionally disabled in this build; copying the link is the working invite path.

  At the very end of your final message, state whether the task went smoothly. If everything worked without problems, end with exactly "verdict: approve". If you hit any problems, bugs, or blockers, briefly say what went wrong and end with exactly "verdict: not-approve".
available_tools:
