id: 00460-share-copy-invite-link-ui
start_url: http://cua_designpen.web
prompt: |-
  Open the Share dialog via the Share button and click "Copy link" to copy the invite link. Verify the copy by pasting the clipboard into any editable field (e.g. a text layer) and confirming it contains the document URL; then remove the pasted text to leave the canvas clean.

  Base your verdict ONLY on whether the clipboard received the share URL. A missing "Copied" label or missing "Link copied" toast is a known display issue and is NOT a blocker for this task.

  At the very end of your final message, state whether the task went smoothly. If everything worked without problems, end with exactly "verdict: approve". If you hit any problems, bugs, or blockers, briefly say what went wrong and end with exactly "verdict: not-approve".
available_tools:
- browser_navigate
- browser_screenshot
- browser_click
- browser_right_click
- browser_double_click
- browser_mouse_move
- browser_drag
- browser_scroll
- browser_scroll_to
- browser_press_key
- browser_type
- browser_wait
- browser_get_page_text
- browser_evaluate
- browser_upload_file
- browser_create_tab
- browser_close_tab
- browser_switch_tab
- browser_list_tabs
required_tools:
- browser
rewards:
- name: Task went smooth (agent verdict)
  kind: answer
  comparator: STRING_CONTAINS
  expected: 'verdict: approve'
