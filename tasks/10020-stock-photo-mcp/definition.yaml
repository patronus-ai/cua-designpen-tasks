id: 10020-stock-photo-mcp
start_url: http://cua_designpen.web
prompt: |-
  Using only MCP tools: create a 400x300 rectangle named Photo, then call stock_photo with the query "mountains" and apply the result to Photo as an image fill. Note: this environment has no external stock-photo provider configured, so stock_photo intentionally applies a deterministic generated placeholder image and reports provider "placeholder" (possibly with a warning saying so) — that IS the expected, correct result here, not a failure; the query only seeds the placeholder's colors. When you are done, call viewport_zoom_to_fit, then verify with get_node / find_nodes that Photo exists at 400x300 and carries an IMAGE-type fill.

  Base your verdict ONLY on the end state: the rectangle named Photo is 400x300 and has an image fill applied by stock_photo. The placeholder provider fallback and its warning are expected in this offline environment and are NOT blockers.

  At the very end of your final message, state whether the task went smoothly. If everything worked without problems, end with exactly "verdict: approve". If you hit any problems, bugs, or blockers, briefly say what went wrong and end with exactly "verdict: not-approve".
available_tools:
- stock_photo
- create_shape
- get_node
- find_nodes
- viewport_zoom_to_fit
required_tools:
- stock_photo
rewards:
- name: Task went smooth (agent verdict)
  kind: answer
  comparator: STRING_CONTAINS
  expected: 'verdict: approve'
