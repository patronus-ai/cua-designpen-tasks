id: 10126-effect-foreground-blur-mcp
start_url: http://cua_designpen.web
prompt: |
  Using only MCP tools: create a 200x120 rectangle named Blurred, then call set_effects on it with type FOREGROUND_BLUR and radius 10. (FOREGROUND_BLUR is the engine's layer/foreground blur family — the blur that softens the node's own pixels, as opposed to a shadow or BACKGROUND_BLUR.)

  When you are done, call viewport_zoom_to_fit, then verify the result with the available MCP tools: read the node back with get_node and confirm it has exactly one effect whose type is FOREGROUND_BLUR with radius 10, not a shadow. Report the effect type and radius you found.

  At the very end of your final message, state whether the task went smoothly. If everything worked without problems, end with exactly "verdict: approve". If you hit any problems, bugs, or blockers, briefly say what went wrong and end with exactly "verdict: not-approve".
available_tools:
- set_effects
- create_shape
- get_node
- find_nodes
- viewport_zoom_to_fit
required_tools:
- set_effects
rewards:
- name: Task went smooth (agent verdict)
  kind: answer
  comparator: STRING_CONTAINS
  expected: 'verdict: approve'
