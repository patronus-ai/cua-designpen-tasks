id: 50002-draw-ui-inspect-mcp-mixed
start_url: http://cua_designpen.web
prompt: 'This time the UI creates and MCP reads.


  1. In the browser, pick the rectangle tool (press R) and drag a rectangle roughly in the middle of the canvas,
  then press Escape to return to the move tool.

  2. Read its X, Y, width and height from the properties panel and write them down.

  3. With MCP, get_page_tree (or find_nodes) — the new rectangle must be there. get_node and node_bounds on it must
  report the same numbers the panel showed, allowing for rounding only.

  4. With MCP, node_resize it to width 240, height 60.

  5. Back in the UI, the selected shape must visibly change and the panel must show 240 x 60 without you touching
  anything else — take a screenshot as evidence.

  6. Nudge the shape with the arrow keys in the UI (5 presses of Right), then get_node again: X must have moved
  by the same amount the panel now shows.


  Work in the order given and keep it tight — one action per step, no exploratory detours. Every time you cross
  from MCP to UI or back, check that both surfaces agree about the same document.


  Report every disagreement you find using exactly this format, one block per finding:


  DESYNC #<n>

  Step: <what you did, on which surface>

  MCP says: <tool call and its result>

  UI says: <what the panel / canvas / layer list shows>

  Severity: <critical | major | minor | cosmetic>


  A value that reads back differently on the two surfaces, an edit on one surface that the other never sees, a node
  missing from one of them, or a stale read after a write all count as findings. Rounding of the same number (e.g.
  99.6 shown as 100) is cosmetic, not a desync. If both surfaces agreed throughout, state exactly "NO DESYNC FOUND".
  At the very end of your final message, end with exactly "mixed-report: complete".'
available_tools:
- browser_navigate
- browser_screenshot
- browser_click
- browser_right_click
- browser_double_click
- browser_mouse_move
- browser_drag
- browser_scroll
- browser_scroll_to
- browser_press_key
- browser_type
- browser_wait
- browser_get_page_text
- browser_evaluate
- browser_upload_file
- browser_create_tab
- browser_close_tab
- browser_switch_tab
- browser_list_tabs
- find_nodes
- get_node
- node_bounds
- node_resize
- get_page_tree
required_tools:
- browser
- find_nodes
- get_node
- node_bounds
- node_resize
- get_page_tree
rewards:
- name: Mixed MCP+UI report delivered
  kind: answer
  comparator: STRING_CONTAINS
  expected: 'mixed-report: complete'
