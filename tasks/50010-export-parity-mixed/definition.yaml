id: 50010-export-parity-mixed
start_url: http://cua_designpen.web
prompt: 'Does an export reflect what the UI shows?


  1. With MCP, create a RECTANGLE 140x90 at x=60 y=60 with fill #E04F5F.

  2. In the browser, select it and move it with the arrow keys (10 presses of Right), then change its corner radius
  to 12 in the properties panel.

  3. With MCP, get_page_tree — the position and radius you just set in the UI must be there.

  4. With MCP, export_svg for that node. The returned SVG must carry the current fill and the rounded corners; an
  export matching the pre-edit state is a finding.

  5. With MCP, viewport_zoom_to_fit, then screenshot the browser — the visible canvas and the SVG you exported must
  describe the same shape.

  6. Do not judge this task by any clipboard action; work from the export payload and the screenshot only.


  Work in the order given and keep it tight — one action per step, no exploratory detours. Every time you cross
  from MCP to UI or back, check that both surfaces agree about the same document.


  Report every disagreement you find using exactly this format, one block per finding:


  DESYNC #<n>

  Step: <what you did, on which surface>

  MCP says: <tool call and its result>

  UI says: <what the panel / canvas / layer list shows>

  Severity: <critical | major | minor | cosmetic>


  A value that reads back differently on the two surfaces, an edit on one surface that the other never sees, a node
  missing from one of them, or a stale read after a write all count as findings. Rounding of the same number (e.g.
  99.6 shown as 100) is cosmetic, not a desync. If both surfaces agreed throughout, state exactly "NO DESYNC FOUND".
  At the very end of your final message, end with exactly "mixed-report: complete".'
available_tools:
- browser_navigate
- browser_screenshot
- browser_click
- browser_right_click
- browser_double_click
- browser_mouse_move
- browser_drag
- browser_scroll
- browser_scroll_to
- browser_press_key
- browser_type
- browser_wait
- browser_get_page_text
- browser_evaluate
- browser_upload_file
- browser_create_tab
- browser_close_tab
- browser_switch_tab
- browser_list_tabs
- create_shape
- set_fill
- get_page_tree
- export_svg
- viewport_zoom_to_fit
required_tools:
- browser
- create_shape
- set_fill
- get_page_tree
- export_svg
- viewport_zoom_to_fit
rewards:
- name: Mixed MCP+UI report delivered
  kind: answer
  comparator: STRING_CONTAINS
  expected: 'mixed-report: complete'
