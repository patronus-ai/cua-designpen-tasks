id: 60011-create-read-types-mcp
start_url: http://cua_designpen.web
prompt: 'Your deliverable is a defect report whose final line is exactly "adversarial-report: complete".
  That line is mandatory and unconditional: emit it if you found defects, if you found none, if the workflow
  could not be finished, and even if you had to abandon the session early. Everything else in this prompt
  is best-effort.


  Using only MCP tools: create a 200x200 rectangle named "Probe", read it back with get_node, rename it
  to "Probe2" with update_node, then call viewport_zoom_to_fit and take a browser screenshot so the result
  can be seen.


  While completing that workflow, attack the tool layer. Call create_shape with a type that does not exist
  ("BLOB"), with width 0, with width -100, with width 1e12, with width as the string "200", and with a
  name of roughly 400 characters. Call get_node, node_bounds and delete_node with an id that does not
  exist ("0:99999"), with an empty string id, with null, and with an id of the wrong shape ("not-an-id").
  Call update_node with a field the schema does not define and with a valid field set to the wrong type.
  For every one of these, the response must be a structured error, never a success and never a stack trace
  — and after each failed call, re-read the document with find_nodes to prove nothing was half-created.
  Finally delete the same node twice and report what the second call returns.


  Baseline for this environment — deviations from it are findings, but these specific behaviours are intended
  and must NOT be reported:

  - Reloading or navigating away discards the unsaved local document; this container deliberately runs
  without persistence.

  - Layout guide bands stay hidden until View > "Layout guides" (Shift+G) is enabled.

  - A shape with no fill exports as a transparent image.

  - Sections are created without a background fill.

  - Numeric fields round their readout; a value that reads back rounded to what you typed is correct.

  - Native dropdown popups sometimes ignore a synthetic click on an option; retry or use the keyboard
  before calling it a defect.


  Turn budget — the report matters, exhaustive probing does not. Work cheaply: screenshot at checkpoints
  rather than after every action, never retry a failed interaction more than twice, and never re-verify
  something you already wrote down. Treat the attack list as a menu: cover at least three of its angles,
  and go further only while you clearly have turns to spare. Aim to finish all probing inside roughly
  30 tool calls; once you approach 40, or the app stops responding, or anything else threatens to cut
  the session short, stop probing immediately and write the report from what you already have. A short
  report that arrives beats a thorough one that never does — an unfinished workflow is not a failed task,
  but a missing report is.


  Context guard — never spend your own output budget on bulk. Do not emit a single tool argument longer
  than about 400 characters: to probe oversized input, send the largest payload that stays under that
  ceiling and say in the report what size you actually tested. A tool that documents or enforces its own
  length cap is not a defect. If a response comes back very large, record its approximate size once and
  do not request it again; if a listing tool would return hundreds of entries, narrow the filter instead
  of re-reading the whole set. Running out of context before the report is written is the one outcome
  that makes this task worthless.


  Log every defect you find using exactly this format, one block per defect:


  DEFECT #<n>

  Steps: <the exact tool calls with their arguments, in order>

  Observed: <what actually happened, including the raw response>

  Expected: <what should have happened>

  Severity: <critical | major | minor | cosmetic>


  Crashes, freezes, unhandled exceptions surfacing as transport errors, invalid input accepted with a
  success response, a partially applied batch that was supposed to be atomic, a tool response that disagrees
  with what the canvas shows, ids returned for nodes that do not exist, and unstructured error payloads
  (anything that is not a clean status/code/message shape) all count as defects. Bad input must be refused
  with a structured error, never with a stack trace and never silently. If you found no defects, state
  exactly "NO DEFECTS FOUND". At the very end of your final message, end with exactly "adversarial-report:
  complete".'
available_tools:
- browser_navigate
- browser_screenshot
- browser_click
- browser_right_click
- browser_double_click
- browser_mouse_move
- browser_drag
- browser_scroll
- browser_scroll_to
- browser_press_key
- browser_type
- browser_wait
- browser_get_page_text
- browser_evaluate
- browser_upload_file
- browser_create_tab
- browser_close_tab
- browser_switch_tab
- browser_list_tabs
- create_shape
- get_node
- find_nodes
- update_node
- delete_node
- node_bounds
- viewport_zoom_to_fit
required_tools:
- browser
rewards:
- name: Adversarial report delivered
  kind: answer
  comparator: STRING_CONTAINS
  expected: 'adversarial-report: complete'
