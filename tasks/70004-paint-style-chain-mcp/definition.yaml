id: 70004-paint-style-chain-mcp
start_url: http://cua_designpen.web
prompt: 'Your deliverable is a report whose final line is exactly "mcp-harness-report: complete". That
  line is mandatory and unconditional: emit it whether the chain ran clean, diverged everywhere, or had
  to be abandoned part-way. Everything else in this prompt is best-effort.


  Using the app''s MCP tools (a browser is available only to screenshot the canvas for confirmation),
  work through the chain below.


  Run a chain across the style entity: create a paint style named "Brand/Blue" with create_paint_style;
  confirm it appears in list_paint_styles and note the id; create two rectangles and apply the style to
  both with apply_paint_style using that id; read each node and identify the field that records the style
  link; change the style''s colour with update_paint_style and confirm both nodes report the new colour
  on the next get_node; detach the style from one node with detach_paint_style and confirm only that node
  lost the link while keeping a concrete fill; overwrite the other node''s fill directly with set_fill
  and check whether the style link survives, is cleared, or is left dangling. Finish with viewport_zoom_to_fit
  and a browser screenshot.


  Two things matter here. First, propagation and link integrity: a style edit must reach every consumer,
  and no node may keep a link to a style it no longer uses. Second, tool-surface completeness: the registry
  exposes create/list/apply/update/detach for paint styles but no delete — state explicitly whether a
  style can be removed at all through the tool surface, and if not, log it as class missing-tool with
  the consequence (styles accumulate with no way to clean up).


  Grounding for this environment — these are intended and must NOT be reported as defects:

  - `setup_problem` and `grade_problem` are harness plumbing, not part of the app''s tool surface; exclude
  them from coverage claims.

  - This deployment has no login, no accounts and no session tokens: the document is local to the container.

  - Reloading or navigating away discards the unsaved document; there is no persistence layer to test.

  - Numeric values may read back rounded; a rounded echo of what you wrote is a correct round-trip.

  - A shape with no fill exports as a transparent image, and sections are created without a background
  fill.


  Turn budget — the report matters, chain completeness does not. Keep calls cheap: batch creations instead
  of looping, screenshot only at the end unless a step needs visual confirmation, and never repeat a call
  whose answer you already recorded. If a step is impossible, record it as a divergence and move on rather
  than retrying. Aim to finish the chain inside roughly 35 tool calls; once you approach 45, or a call
  hangs, or the container stops responding, stop the chain immediately and write the report plus the matrix
  block from what you already have. Steps you never reached are reported as not-exercised — that is a
  normal outcome. A missing report is the only real failure.


  Context guard — never spend your own output budget on bulk. Do not emit a single tool argument longer
  than about 400 characters: to probe oversized input, send the largest payload that stays under that
  ceiling and say in the report what size you actually tested. A tool that documents or enforces its own
  length cap is not a defect. If a response comes back very large, record its approximate size once and
  do not request it again; if a listing tool would return hundreds of entries, narrow the filter instead
  of re-reading the whole set. Running out of context before the report is written is the one outcome
  that makes this task worthless.


  Run this as a chain, not as isolated calls: the output of each step must be the input of the next, and
  you must never retype a value you could have read. Before every call, state one line "EXPECT: <what
  the response should contain>". After every call, state "ACTUAL: <what came back>" and then "OK" or "MISMATCH".
  Never repair a mismatch silently — record it, then continue the chain so later steps still get exercised.


  Report every divergence using exactly this format, one block per divergence:


  MISMATCH #<n>

  Step: <step number and tool name>

  Call: <tool name with the exact arguments used>

  Expected: <what the PRD-level behaviour or the previous step implies>

  Actual: <the response, quoted>

  Class: <round-trip | list-vs-detail | broken-reference | stale-read | shape-drift | pagination | error-quality
  | context-size | missing-tool>

  Severity: <critical | major | minor | cosmetic>


  A field that does not survive a write/read round-trip, a list response that disagrees with the detail
  response about the same entity, a reference pointing at an entity that no longer exists, a read that
  does not yet reflect a write that already returned, a silently truncated result set, and an error too
  vague to self-correct from all count as divergences.


  The quality-matrix rows in scope for this chain are: 2.x, 9.x, 19.x. Judge each one from what this chain
  actually showed.


  Close with a matrix block, one line per row you actually exercised, using exactly this shape:


  MATRIX

  <row> <PASS | FAIL | N/A> — <one-line evidence, naming the tool call that proves it>


  Use N/A only with evidence for why the row cannot apply here, never as a way to skip a row you could
  have tested. Then, at the very end of your final message, end with exactly "mcp-harness-report: complete".'
